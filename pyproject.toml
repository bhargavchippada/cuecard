[project]
name = "cuecard"
version = "0.1.0"
description = "The right rule, at the right moment. Contextual rule enforcement for AI coding agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Bhargav Chippada" },
]
keywords = ["ai", "coding-agents", "rules", "semantic-search", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastembed>=0.4",
    "numpy>=1.24",
    "typer>=0.9",
    "rich>=13",
]

[project.scripts]
cuecard = "cuecard.cli:app"

[project.urls]
Homepage = "https://github.com/bhargavpatel/cuecard"
Repository = "https://github.com/bhargavpatel/cuecard"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cuecard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that use real embedding model (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["fastembed.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["cuecard"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.8",
]
